name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to increment'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: ver
        run: |
          git fetch origin stable develop
          CURRENT=$(awk '/^# [0-9]/ { match($0, /[0-9]+\.[0-9]+\.[0-9]+/); print substr($0, RSTART, RLENGTH); exit }' CHANGELOG.md)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Current: $CURRENT → Next: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Guard — tag must not already exist
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "::error::Tag ${{ steps.ver.outputs.version }} already exists."
            exit 1
          fi

      - name: Guard — develop must be ahead of stable
        run: |
          AHEAD=$(git rev-list --count origin/stable..origin/develop)
          if [ "$AHEAD" -eq 0 ]; then
            echo "::error::develop has no commits ahead of stable. Nothing to release."
            exit 1
          fi
          echo "$AHEAD commit(s) to release."

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch from develop
        run: |
          git checkout -b "release/${{ steps.ver.outputs.version }}" origin/develop

      - name: Generate changelog section
        id: changelog
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          DATE=$(date +%Y-%m-%d)

          COMMITS=$(git log origin/stable..origin/develop --oneline --no-merges --reverse)

          FEATS=$(echo "$COMMITS" | grep -E '^[a-f0-9]+ feat'     | sed -E 's/^[a-f0-9]+ feat(\([^)]*\))?: /- /'     || true)
          FIXES=$(echo "$COMMITS" | grep -E '^[a-f0-9]+ fix'      | sed -E 's/^[a-f0-9]+ fix(\([^)]*\))?: /- /'      || true)
          REFAC=$(echo "$COMMITS" | grep -E '^[a-f0-9]+ refactor'  | sed -E 's/^[a-f0-9]+ refactor(\([^)]*\))?: /- /' || true)

          {
            echo "# $VERSION — $DATE"
            echo ""
            [ -n "$FEATS" ] && printf "### Added\n%s\n\n" "$FEATS"
            [ -n "$FIXES" ] && printf "### Fixed\n%s\n\n" "$FIXES"
            [ -n "$REFAC" ] && printf "### Changed\n%s\n\n" "$REFAC"
            echo "---"
            echo ""
          } > new_section.md

          cat new_section.md CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

          # Store for PR body
          echo "section<<EOF" >> "$GITHUB_OUTPUT"
          cat new_section.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Commit changelog
        run: |
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG.md for ${{ steps.ver.outputs.version }}"
          git push origin "release/${{ steps.ver.outputs.version }}"

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base stable \
            --head "release/${{ steps.ver.outputs.version }}" \
            --title "release: ${{ steps.ver.outputs.version }}" \
            --body "$(cat new_section.md)
          ---
          Merging this PR will tag \`${{ steps.ver.outputs.version }}\` and trigger the release build."
